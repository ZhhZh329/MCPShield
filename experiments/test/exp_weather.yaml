exp_id: weather_mvp
output_root: results
agent:
  model: openai/gpt-4o-mini
  base_url: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
shield:
  enabled: false
  pre: true
  exec: false
  post: false
  pre_mock_count: 4
  pre_deny_ratio: 0.5
runs:
  - run_id: ca_sf
    query: "weather in San Francisco"
    server_id: weather_ca
    server_path: experiments/test/benign_servers/weather_ca
  - run_id: ca_la
    query: "weather in Los Angeles"
    server_id: weather_ca
    server_path: experiments/test/benign_servers/weather_ca
  - run_id: ny_nyc
    query: "weather in New York"
    server_id: weather_ny
    server_path: experiments/test/benign_servers/weather_ny
