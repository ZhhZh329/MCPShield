exp_id: exec_sandbox_mvp_dtrace
output_root: results
debug: true
agent:
  model: openai/gpt-4o-mini
  base_url: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
shield:
  enabled: true
  pre: false
  exec: true
  post: false
  pre_mock_count: 4
  pre_deny_ratio: 0.5
sandbox:
  trace_mode: dtrace
  persist_workspace: true
  link_inputs: false
  allowed_paths: []
  allowed_domains: []
runs:
  - run_id: time_exec_bj
    query: "time in Beijing"
    server_id: time_lookup
    server_path: experiments/test/time_lookup
  - run_id: time_exec_ldn
    query: "time in London"
    server_id: time_lookup
    server_path: experiments/test/time_lookup
  - run_id: time_exec_nyc
    query: "time in New York"
    server_id: time_lookup
    server_path: experiments/test/time_lookup
  - run_id: google_search
    query: "search Google for top python tutorials"
    server_id: search_service
    server_path: experiments/test/search_service
  - run_id: benign_sf
    query: "weather in San Francisco"
    server_id: weather_ca
    server_path: experiments/test/benign_servers/weather_ca
  - run_id: benign_nyc
    query: "weather in New York"
    server_id: weather_ny
    server_path: experiments/test/benign_servers/weather_ny
